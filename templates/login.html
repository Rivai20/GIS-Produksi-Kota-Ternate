<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | GIS Produksi Ternate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-intro">
        <span class="eyebrow">SISTEM INFORMASI GEOSPASIAL</span>
        <h1>Peta produksi Kota Ternate</h1>
        <p>Kelola dan lihat sebaran hasil produksi perikanan serta pertanian berbasis wilayah.</p>
        <div class="login-map-lines"></div>
      </section>
      <section class="login-card">
        <div class="brand-logo">◉</div>
        <h2>Masuk ke sistem</h2>
        <p class="login-muted">Gunakan akun sesuai peran Anda.</p>
        {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
        <form method="post" class="login-form">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button class="primary-btn" type="submit">Masuk</button>
        </form>
        <a class="back-dashboard-btn" href="{{ url_for('index') }}">Kembali ke dashboard utama</a>
      </section>
    </main>
  </body>
</html>
